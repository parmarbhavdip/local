<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <button type="button" class="btn btn-danger">Danger</button>
                <button type="button" class="btn btn-warning">Warning</button>
                <button type="button" class="btn btn-info">Info</button>
                <button type="button" class="btn btn-success">success</button>
                <button type="button" class="btn btn-primary">primary</button>
                <button type="button" class="btn btn-secondary">secondary</button>
                <button type="button" class="btn btn-dark">dark</button>
                <button type="button" class="btn btn-light">white</button>
            </div>
        </div>
        <!-- 
            m = margin 
            t = top 
            b = bottom
            s = start/left
            e = end/right
            possible unit are 0,1,2,3,4,5
        -->
        <div class="row mt-3 ms-5 me-5 mb-3">
            <div class="col-12">
                <button type="button" class="btn btn-lg btn-danger">Danger</button>
                <button type="button" class="btn btn-lg btn-warning">Warning</button>
                <button type="button" class="btn btn-lg btn-info">Info</button>
                <button type="button" class="btn btn-lg btn-success">success</button>
                <button type="button" class="btn btn-lg btn-primary">primary</button>
                <button type="button" class="btn btn-lg btn-secondary">secondary</button>
                <button type="button" class="btn btn-lg btn-dark">dark</button>
                <button type="button" class="btn btn-lg btn-light">white</button>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <button type="button" class="btn btn-sm btn-danger">Danger</button>
                <button type="button" class="btn btn-sm btn-warning">Warning</button>
                <button type="button" class="btn btn-sm btn-info">Info</button>
                <button type="button" class="btn btn-sm btn-success">success</button>
                <button type="button" class="btn btn-sm btn-primary">primary</button>
                <button type="button" class="btn btn-sm btn-secondary">secondary</button>
                <button type="button" class="btn btn-sm btn-dark">dark</button>
                <button type="button" class="btn btn-sm btn-light">white</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
